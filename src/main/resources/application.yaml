spring:
  application:
    name: expense-analyzer
  datasource:
    url: ${DATABASE_URL}
  output:
    ansi:
      enabled: ALWAYS
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: expense_analyzer
    open-in-view: false
  jackson:
    serialization:
      FAIL_ON_EMPTY_BEANS: false
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
    time-zone: UTC

rsa:
  private-key: ${RSA_PRIVATE_KEY}
  public-key: ${RSA_PUBLIC_KEY}

server:
  port: ${PORT:8080}
  address: 0.0.0.0

ai:
  api:
    key: ${AI_API_KEY}
    base-url: https://generativelanguage.googleapis.com/v1beta/models
    # Pinned model id (no floating "-latest" alias); override with AI_MODEL when Google retires it
    model: ${AI_MODEL:gemini-2.5-flash}

gocardless:
  api:
    base-url: https://bankaccountdata.gocardless.com/api/v2
    secret-id: ${GOCARDLESS_SECRET_ID}
    secret-key: ${GOCARDLESS_SECRET_KEY}

categorization:
  ai:
    batch-size: 25            # distinct merchants per AI request
    concurrency: 2            # parallel AI requests
    max-attempts: 3           # per request, with exponential backoff on 429/5xx
    retry-base-delay: PT2S
    circuit-failure-threshold: 5
    circuit-cooldown: PT5M
  worker:
    interval: PT1M
    claim-size: 100
    max-retries: 5            # failed attempts before a row becomes FAILED
    retry-base-delay: PT5M    # doubles per attempt
    lease: PT10M


sync:
  # GoCardless allows only 4 transaction fetches per account per day
  min-interval: ${SYNC_MIN_INTERVAL:6h}
