spring:
  application:
    name: expense-analyzer
  datasource:
    url: ${DATABASE_URL}
  output:
    ansi:
      enabled: ALWAYS
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: expense_analyzer
    open-in-view: false
  jackson:
    serialization:
      FAIL_ON_EMPTY_BEANS: false
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
    time-zone: UTC

rsa:
  private-key: ${RSA_PRIVATE_KEY}
  public-key: ${RSA_PUBLIC_KEY}

server:
  port: ${PORT:8080}
  address: 0.0.0.0

ai:
  api:
    key: ${AI_API_KEY}
    base-url: https://generativelanguage.googleapis.com/v1beta/models
    # Pinned model id (no floating "-latest" alias); override with AI_MODEL when Google retires it
    model: ${AI_MODEL:gemini-2.5-flash}

gocardless:
  api:
    base-url: https://bankaccountdata.gocardless.com/api/v2
    secret-id: ${GOCARDLESS_SECRET_ID}
    secret-key: ${GOCARDLESS_SECRET_KEY}

categorization:
  ai:
    batch-size: 25
  other-retry:
    max-retries: 3
    batch-size: 50
    cron: "0 0 3 * * *"
    zone: "UTC"


sync:
  # GoCardless allows only 4 transaction fetches per account per day
  min-interval: ${SYNC_MIN_INTERVAL:6h}
